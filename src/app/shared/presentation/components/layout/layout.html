<mat-toolbar class="toolbar" role="banner">
  <div class="brand">
    <img class="logo" [src]="logoUrl" alt="Red Cross logo" width="40" height="40" />
    <span class="brand-title">{{ 'toolbar.title' | translate }}</span>
  </div>

  <nav class="options">
    @for (option of options(); track option.link) {
      <a
        mat-button
        [routerLink]="option.link"
        routerLinkActive="active-option"
        ariaCurrentWhenActive="page"
      >
        {{ option.label | translate }}
      </a>
    }
  </nav>
  <app-language-switcher />
</mat-toolbar>
<main class="content">
  <router-outlet />
</main>
<app-footer-content/>
