<section class="page-not-found" role="alert">
  <h1>{{ 'page-not-found.title' | translate }}</h1>
  <p [innerHTML]="'page-not-found.content' | translate: { invalidPath: invalidPath }"></p>
  <button mat-flat-button type="button" (click)="navigateToHome()" [attr.aria-label]="'page-not-found.go-home' | translate">
    {{ 'page-not-found.go-home' | translate }}
  </button>
</section>
